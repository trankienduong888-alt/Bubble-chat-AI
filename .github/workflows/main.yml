
name: Build Bubble Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP file
        run: |
          ls -lah
          test -f BubbleChatAndroid-cloud-build.zip

      - name: Extract project
        run: unzip -o BubbleChatAndroid-cloud-build.zip

      - name: Check project folder
        run: |
          ls -lah
          test -d BubbleChatAndroid

      - name: Build APK
        working-directory: BubbleChatAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleChat-debug-apk
          path: BubbleChatAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
